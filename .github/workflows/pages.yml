name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/phy489/courseware/' --exclude='/phy460/courseware/' --exclude='/phy407/courseware/' ./ "$RUNNER_TEMP/pages-site/"
          test ! -e "$RUNNER_TEMP/pages-site/phy489/courseware"
          test ! -e "$RUNNER_TEMP/pages-site/phy460/courseware"
          test ! -e "$RUNNER_TEMP/pages-site/phy407/courseware"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
